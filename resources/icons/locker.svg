<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="60%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="lkrShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Main Bag Body -->
  <rect x="20" y="36" width="88" height="76" rx="14" fill="url(#bagGrad)" stroke="#451A03" stroke-width="6" filter="url(#lkrShadow)"/>
  <!-- Top Handle -->
  <path d="M 46 36 L 46 22 C 46 16 54 14 64 14 C 74 14 82 16 82 22 L 82 36" fill="none" stroke="#451A03" stroke-width="12" stroke-linecap="round"/>
  <path d="M 46 36 L 46 22 C 46 18 54 18 64 18 C 74 18 82 18 82 22 L 82 36" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
  <!-- Front Flap -->
  <path d="M 20 40 L 108 40 L 108 72 C 108 80 100 86 92 86 L 36 86 C 28 86 20 80 20 72 Z" fill="url(#flapGrad)" stroke="#451A03" stroke-width="5"/>
  <!-- Straps -->
  <rect x="36" y="40" width="10" height="58" rx="3" fill="#78350F" stroke="#451A03" stroke-width="2"/>
  <rect x="82" y="40" width="10" height="58" rx="3" fill="#78350F" stroke="#451A03" stroke-width="2"/>
  <!-- Center Gold Buckle -->
  <rect x="52" y="70" width="24" height="24" rx="5" fill="#FBBF24" stroke="#78350F" stroke-width="4"/>
  <rect x="58" y="76" width="12" height="12" rx="2" fill="#78350F"/>
</svg>
