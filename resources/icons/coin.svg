<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="coinFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF587"/>
      <stop offset="50%" stop-color="#FFC000"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="innerFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Rim with thick outline -->
  <circle cx="64" cy="64" r="56" fill="url(#coinFace)" stroke="#78350F" stroke-width="6" filter="url(#cShadow)"/>
  <!-- Bevel Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#FEF08A" stroke-width="4"/>
  <circle cx="64" cy="64" r="40" fill="url(#innerFace)" stroke="#B45309" stroke-width="2"/>
  <!-- Center Star/Diamond Symbol -->
  <polygon points="64,36 71,54 89,57 75,69 80,87 64,77 48,87 53,69 39,57 57,54" fill="#FEF08A" stroke="#92400E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top Specular Highlight Arc -->
  <path d="M 32 38 A 46 46 0 0 1 96 38" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  <ellipse cx="44" cy="42" rx="14" ry="7" fill="#FFFFFF" opacity="0.45" transform="rotate(-35 44 42)"/>
</svg>
