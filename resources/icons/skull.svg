<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="skullGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="90%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <filter id="skShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- Skull Main Body (Cranium + Jaw) -->
  <path d="M 64 12 C 34 12 18 34 18 62 C 18 78 28 88 38 94 L 38 108 C 38 114 44 120 50 120 L 78 120 C 84 120 90 114 90 108 L 90 94 C 100 88 110 78 110 62 C 110 34 94 12 64 12 Z" fill="url(#skullGrad)" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" filter="url(#skShadow)"/>
  <!-- Big Cartoony Eye Sockets -->
  <ellipse cx="44" cy="58" rx="14" ry="18" fill="#1E293B" transform="rotate(-6 44 58)"/>
  <ellipse cx="84" cy="58" rx="14" ry="18" fill="#1E293B" transform="rotate(6 84 58)"/>
  <!-- Triangular Nose -->
  <polygon points="64,74 58,86 70,86" fill="#1E293B" stroke-linejoin="round"/>
  <!-- Teeth Lines -->
  <line x1="52" y1="102" x2="52" y2="120" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="102" x2="64" y2="120" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="102" x2="76" y2="120" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <!-- Forehead Gloss Highlight -->
  <ellipse cx="46" cy="28" rx="18" ry="8" fill="#FFFFFF" opacity="0.6" transform="rotate(-15 46 28)"/>
</svg>
